<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏃 Encuentra a tu Corredor</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body {
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            min-height: 100vh;
            padding: 20px;
            color: #fff;
        }
        .container { max-width: 900px; margin: 0 auto; }
        header { text-align: center; padding: 30px 0; }
        header h1 { font-size: 2.2rem; color: #00ffcc; text-shadow: 0 0 15px rgba(0,255,204,0.4); }
        .buscador {
            background: rgba(255,255,255,0.1);
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            margin-bottom: 30px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
        }
        input {
            padding: 14px 20px;
            font-size: 1.2rem;
            width: 220px;
            border-radius: 10px;
            border: none;
            background: rgba(255,255,255,0.95);
            color: #0f2027;
            text-align: center;
            font-weight: bold;
            margin: 10px;
        }
        button {
            padding: 14px 30px;
            font-size: 1.1rem;
            border: none;
            border-radius: 10px;
            background: #00ffcc;
            color: #0f2027;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        button:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(0,255,204,0.4); }
        .tarjeta-corredor {
            background: rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 30px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
            display: none;
        }
        .info-principal {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            align-items: center;
            margin-bottom: 30px;
        }
        .foto-perfil {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #00ffcc;
            box-shadow: 0 0 20px rgba(0,255,204,0.3);
        }
        .datos h2 { font-size: 1.8rem; color: #00ffcc; margin-bottom: 10px; }
        .datos p { font-size: 1.1rem; margin: 8px 0; }
        .etiqueta {
            display: inline-block;
            background: #00ffcc;
            color: #0f2027;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
            margin-left: 10px;
        }
        .galeria { margin-top: 20px; }
        .galeria h3 { color: #00ffcc; margin-bottom: 15px; }
        .fotos {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
        }
        .fotos img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.3s;
            border: 2px solid transparent;
        }
        .fotos img:hover {
            transform: scale(1.05);
            border-color: #00ffcc;
        }
        .mensaje { text-align: center; padding: 40px 20px; font-size: 1.2rem; color: #ff6b6b; display: none; }
        .ejemplos { margin-top: 20px; font-size: 0.9rem; color: #aaa; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🏃 ENCUENTRA A TU CORREDOR</h1>
        <p>Ingresa el número y descubre su información</p>
    </header>

    <div class="buscador">
        <h2>🔍 Buscar Corredor</h2>
        <input type="number" id="numCorredor" placeholder="Número" min="1">
        <button onclick="buscarCorredor()">🔎 Buscar</button>
        <p class="ejemplos">Ejemplos: 1, 2, 3, 4, 5</p>
    </div>

    <div id="tarjeta" class="tarjeta-corredor">
        <div class="info-principal">
            <img id="fotoPerfil" class="foto-perfil" src="" alt="Foto del corredor">
            <div class="datos">
                <h2 id="nombreCorredor"></h2>
                <p><strong>Número:</strong> <span id="mostrarNumero"></span> <span class="etiqueta">ACTIVO</span></p>
                <p><strong>Categoría:</strong> <span id="categoria"></span></p>
                <p><strong>Equipo:</strong> <span id="equipo"></span></p>
                <p><strong>Tiempo:</strong> <span id="tiempo"></span></p>
            </div>
        </div>

        <div class="galeria">
            <h3>📸 Galería de Imágenes</h3>
            <div id="fotosGaleria" class="fotos"></div>
        </div>
    </div>

    <div id="mensajeNoEncontrado" class="mensaje">
        ⚠️ No existe ningún corredor con ese número
    </div>
</div>

<script>
// BASE DE DATOS DE CORREDORES — AGREGA, EDITA O ELIMINA AQUÍ
const corredores = [
    {
        numero: 1,
        nombre: "Carlos Méndez",
        categoria: "5km Libre",
        equipo: "Velocidad CDMX",
        tiempo: "18:45 min",
        fotoPerfil: "https://picsum.photos/id/1012/300/300",
        galeria: [
            "https://picsum.photos/id/1012/400/300",
            "https://picsum.photos/id/1005/400/300",
            "https://picsum.photos/id/1025/400/300",
            "https://picsum.photos/id/1035/400/300"
        ]
    },
    {
        numero: 2,
        nombre: "Ana Rodríguez",
        categoria: "10km Femenil",
        equipo: "Corredoras del Sol",
        tiempo: "42:10 min",
        fotoPerfil: "https://picsum.photos/id/1027/300/300",
        galeria: [
            "https://picsum.photos/id/1027/400/300",
            "https://picsum.photos/id/1011/400/300",
            "https://picsum.photos/id/1000/400/300"
        ]
    },
    {
        numero: 3,
        nombre: "Roberto Sánchez",
        categoria: "10km Libre",
        equipo: "Atletismo México",
        tiempo: "38:22 min",
        fotoPerfil: "https://picsum.photos/id/1019/300/300",
        galeria: [
            "https://picsum.photos/id/1019/400/300",
            "https://picsum.photos/id/1024/400/300",
            "https://picsum.photos/id/1036/400/300",
            "https://picsum.photos/id/1040/400/300",
            "https://picsum.photos/id/1048/400/300"
        ]
    },
    {
        numero: 4,
        nombre: "Laura Jiménez",
        categoria: "5km Femenil",
        equipo: "Estrellas del Aire",
        tiempo: "21:05 min",
        fotoPerfil: "https://picsum.photos/id/1062/300/300",
        galeria: [
            "https://picsum.photos/id/1062/400/300",
            "https://picsum.photos/id/1054/400/300",
            "https://picsum.photos/id/1063/400/300"
        ]
    },
    {
        numero: 5,
        nombre: "Miguel Ángel López",
        categoria: "Medio Maratón",
        equipo: "Fuerza y Pasión",
        tiempo: "1h 18min",
        fotoPerfil: "https://picsum.photos/id/1006/300/300",
        galeria: [
            "https://picsum.photos/id/1006/400/300",
            "https://picsum.photos/id/1009/400/300",
            "https://picsum.photos/id/1015/400/300",
            "https://picsum.photos/id/1022/400/300"
        ]
    }
    // SIGUE EL MISMO FORMATO PARA AGREGAR MÁS:
    // ,{
    //     numero: 6,
    //     nombre: "Nombre Completo",
    //     categoria: "Categoría",
    //     equipo: "Nombre del Equipo",
    //     tiempo: "00:00 min",
    //     fotoPerfil: "enlace_foto_perfil.jpg",
    //     galeria: [
    //         "enlace_foto1.jpg",
    //         "enlace_foto2.jpg"
    //     ]
    // }
];

function buscarCorredor() {
    const num = parseInt(document.getElementById('numCorredor').value);
    const tarjeta = document.getElementById('tarjeta');
    const aviso = document.getElementById('mensajeNoEncontrado');

    // Ocultar todo primero
    tarjeta.style.display = 'none';
    aviso.style.display = 'none';

    if (!num) {
        alert('Escribe un número válido');
        return;
    }

    // Buscar corredor
    const corredor = corredores.find(c => c.numero === num);

    if (!corredor) {
        aviso.style.display = 'block';
        return;
    }

    // Mostrar datos
    document.getElementById('fotoPerfil').src = corredor.fotoPerfil;
    document.getElementById('nombreCorredor').textContent = corredor.nombre;
    document.getElementById('mostrarNumero').textContent = corredor.numero;
    document.getElementById('categoria').textContent = corredor.categoria;
    document.getElementById('equipo').textContent = corredor.equipo;
    document.getElementById('tiempo').textContent = corredor.tiempo;

    // Cargar galería
    const contenedorGaleria = document.getElementById('fotosGaleria');
    contenedorGaleria.innerHTML = '';
    corredor.galeria.forEach(foto => {
        const img = document.createElement('img');
        img.src = foto;
        img.alt = "Imagen del corredor";
        contenedorGaleria.appendChild(img);
    });

    // Mostrar tarjeta
    tarjeta.style.display = 'block';
}

// Permitir buscar con la tecla Enter
document.getElementById('numCorredor').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') buscarCorredor();
});
</script>

</body>
</html>
