<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏃 Encuentra a tu Corredor</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body {
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            min-height: 100vh;
            padding: 20px;
            color: #fff;
        }
        .container { max-width: 900px; margin: 0 auto; }
        header { text-align: center; padding: 30px 0; }
        header h1 { font-size: 2.2rem; color: #00ffcc; text-shadow: 0 0 15px rgba(0,255,204,0.4); }
        .buscador {
            background: rgba(255,255,255,0.1);
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            margin-bottom: 30px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
        }
        input {
            padding: 14px 20px;
            font-size: 1.2rem;
            width: 220px;
            border-radius: 10px;
            border: none;
            background: rgba(255,255,255,0.95);
            color: #0f2027;
            text-align: center;
            font-weight: bold;
            margin: 10px;
        }
        button {
            padding: 14px 30px;
            font-size: 1.1rem;
            border: none;
            border-radius: 10px;
            background: #00ffcc;
            color: #0f2027;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        button:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(0,255,204,0.4); }
        .tarjeta-corredor {
            background: rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 30px;
            display: none;
        }
        .info-principal {
            display: flex;
            flex-wrap: wrap; gap: 30px; align-items: center; margin-bottom: 30px;
        }
        .foto-perfil {
            width: 180px; height: 180px; border-radius: 50%;
            object-fit: cover; border: 4px solid #00ffcc;
        }
        .datos h2 { color: #00ffcc; margin-bottom: 10px; }
        .datos p { margin: 8px 0; font-size: 1.1rem; }
        .galeria { margin-top: 20px; }
        .galeria h3 { color: #00ffcc; margin-bottom: 15px; }
        .fotos { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; }
        .fotos img {
            width: 100%; height: 150px; object-fit: cover; border-radius: 10px;
        }
        .mensaje { display: none; text-align: center; padding: 40px; color: #ff6b6b; font-size: 1.2rem; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🏃 ENCUENTRA A TU CORREDOR</h1>
        <p>Escribe tu número y ve tus fotos</p>
    </header>

    <div class="buscador">
        <h2>🔍 Buscar por Número</h2>
        <input type="number" id="numCorredor" placeholder="Tu número" min="1">
        <button onclick="buscarCorredor()">Buscar</button>
    </div>

    <div id="tarjeta" class="tarjeta-corredor">
        <div class="info-principal">
            <img id="fotoPerfil" class="foto-perfil" src="" alt="Foto">
            <div class="datos">
                <h2 id="nombreCorredor"></h2>
                <p><strong>Número:</strong> <span id="mostrarNumero"></span></p>
                <p><strong>Categoría:</strong> <span id="categoria"></span></p>
                <p><strong>Equipo:</strong> <span id="equipo"></span></p>
                <p><strong>Tiempo:</strong> <span id="tiempo"></span></p>
            </div>
        </div>
        <div class="galeria">
            <h3>📸 Fotos del Corredor</h3>
            <div id="fotosGaleria" class="fotos"></div>
        </div>
    </div>

    <div id="noEncontrado" class="mensaje">
        ⚠️ No hay ningún corredor con ese número
    </div>
</div>

<script>
// =============================================
// AQUÍ PONES TUS CORREDORES Y TUS FOTOS
// =============================================
const corredores = [
    {
        numero: 1,
        nombre: "Juan Pérez",
        categoria: "5km Libre",
        equipo: "Velocidad CDMX",
        tiempo: "18:45 min",
        fotoPerfil: "juan_perfil.jpg",        // ← IGUAL AL NOMBRE DEL ARCHIVO
        galeria: [
            "juan_carrera1.jpg",
            "juan_carrera2.jpg"
        ]
    },
    {
        numero: 2,
        nombre: "María López",
        categoria: "10km Femenil",
        equipo: "Corredoras del Sol",
        tiempo: "42:10 min",
        fotoPerfil: "maria_perfil.jpg",       // ← IGUAL AL NOMBRE DEL ARCHIVO
        galeria: [
            "maria_carrera1.jpg"
        ]
    }
    // ============================================
    // PARA AGREGAR OTRO, COPIA ESTO Y LLÉNALO:
    // ============================================
    // ,{
    //     numero: 3,
    //     nombre: "Nombre Completo",
    //     categoria: "Categoría",
    //     equipo: "Equipo",
    //     tiempo: "00:00 min",
    //     fotoPerfil: "foto_perfil.jpg",
    //     galeria: [
    //         "foto1.jpg",
    //         "foto2.jpg"
    //     ]
    // }
];

function buscarCorredor() {
    const num = parseInt(document.getElementById('numCorredor').value);
    const tarjeta = document.getElementById('tarjeta');
    const aviso = document.getElementById('noEncontrado');

    tarjeta.style.display = 'none';
    aviso.style.display = 'none';

    if (!num) return alert('Escribe un número');

    const corredor = corredores.find(c => c.numero === num);

    if (!corredor) {
        aviso.style.display = 'block';
        return;
    }

    document.getElementById('fotoPerfil').src = corredor.fotoPerfil;
    document.getElementById('nombreCorredor').textContent = corredor.nombre;
    document.getElementById('mostrarNumero').textContent = corredor.numero;
    document.getElementById('categoria').textContent = corredor.categoria;
    document.getElementById('equipo').textContent = corredor.equipo;
    document.getElementById('tiempo').textContent = corredor.tiempo;

    const galeria = document.getElementById('fotosGaleria');
    galeria.innerHTML = '';
    corredor.galeria.forEach(foto => {
        const img = document.createElement('img');
        img.src = foto;
        galeria.appendChild(img);
    });

    tarjeta.style.display = 'block';
}

document.getElementById('numCorredor').addEventListener('keypress', e => {
    if (e.key === 'Enter') buscarCorredor();
});
</script>

</body>
</html>
